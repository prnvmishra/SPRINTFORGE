<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurora Recipe Studio</title>
    <style>
/* Aurora Recipe Studio — stylesheet.
   Tokens first, then the page shell, then the components. Every colour and
   radius resolves through a token, so the theme re-skins from :root alone. */

/* 1. Design tokens ----------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

:root {
  --surface: #0f1115;
  --surface-raised: #171a21;
  --border: #262b36;
  --text: #eef1f6;
  --muted: #a2abbd;
  --accent: #ffb057;
  --radius: 14px;
  --font-sans: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
}

/* 2. Page shell -------------------------------------------------------- */
body {
  margin: 0;
  background-color: var(--surface);
  color: var(--text);
  font-family: var(--font-sans);
  line-height: 1.6;
}

/* 3. Header bar -------------------------------------------------------- */
header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 32px;
  background-color: var(--surface-raised);
  border-bottom: 1px solid var(--border);
}

header h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 650;
  letter-spacing: -0.01em;
  color: var(--text);
}

/* 4. Primary navigation ------------------------------------------------ */
nav ul {
  display: flex;
  align-items: center;
  gap: 28px;
  margin: 0;
  padding: 0;
  list-style: none;
}

nav a {
  color: var(--muted);
  text-decoration: none;
  font-size: 15px;
  font-weight: 500;
  padding: 6px 2px;
  border-bottom: 2px solid transparent;
  transition: color 160ms ease, border-color 160ms ease;
}

nav a:hover {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

nav a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
  border-radius: 4px;
}

/* 5. Hero -------------------------------------------------------------- */
main {
  max-width: 1200px;
  margin: 0 auto;
}

#hero {
  padding: 72px 32px 56px;
  text-align: center;
}

#hero h2 {
  margin: 0 0 16px;
  font-size: clamp(1.75rem, 5vw, 2.75rem);
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
}

#hero p {
  max-width: 56ch;
  margin: 0 auto 40px;
  color: var(--muted);
  font-size: 18px;
}

#hero img {
  display: block;
  width: 100%;
  max-width: 100%;
  height: auto;
  aspect-ratio: 16 / 7;
  object-fit: cover;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}

/* 7. Footer ------------------------------------------------------------ */
footer {
  padding: 32px;
  border-top: 1px solid var(--border);
  background-color: var(--surface-raised);
  color: var(--muted);
  font-size: 14px;
}

footer p {
  margin: 0;
}


/* 8. Recipe grid ------------------------------------------------------- */
#recipeList {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 24px;
  padding: 0 32px 72px;
}

#recipeList h2 {
  grid-column: 1 / -1;
  margin: 0 0 8px;
  font-size: 28px;
  font-weight: 650;
  color: var(--text);
}

/* 9. Recipe card ------------------------------------------------------- */
.card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px;
  background-color: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
  border-color: var(--accent);
}

.card img {
  width: 100%;
  height: auto;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  border-radius: 10px;
  display: block;
}

.card h3 {
  margin: 0;
  font-size: 18px;
  font-weight: 620;
  line-height: 1.3;
  color: var(--text);
}

.card p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}


/* 10. Small screens ---------------------------------------------------- */
@media (max-width: 640px) {
  header {
    padding: 14px 20px;
  }

  nav ul {
    gap: 18px;
  }

  #hero {
    padding: 40px 20px 32px;
  }

  #recipeList {
    grid-template-columns: 1fr;
    gap: 16px;
    padding: 0 20px 48px;
  }

  footer {
    padding: 24px 20px;
  }
}

</style>
  </head>
  <body>
    <header class="site-header">
      <h1>Aurora Recipe Studio</h1>
      <nav class="site-nav" aria-label="Primary navigation">
        <ul class="site-nav__list">
          <li><a class="site-nav__link" href="#recipeList">Browse</a></li>
          <li><a class="site-nav__link" href="#bookings">My Bookings</a></li>
          <li><a class="site-nav__link" href="#account">Account</a></li>
        </ul>
      </nav>
    </header>

    <main id="app">
      <section id="hero" class="hero">
        <h2>Cook something worth remembering</h2>
        <p class="hero__tagline">
          Curated recipes from working chefs, filtered to what you actually have
          in the kitchen tonight.
        </p>
        <img
          class="hero__image"
          src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1600&q=80"
          alt="Roasted vegetables and herbs plated on a dark ceramic dish"
          width="1600"
          height="900"
        />
      </section>

      <section id="recipeList" class="recipe-list">
        <h2>Tonight's picks</h2>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Aurora Recipe Studio. Cook boldly.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
