# SprintForge.AI - Render Deployment with Neon Database
# No credit card required + No database time limit

services:
  # Backend API Service
  - type: web
    name: sprintforge-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free  # Free tier: 750 hours/month
    region: oregon  # Choose region closest to you
    
    # Environment Variables
    envVars:
      - key: ENVIRONMENT
        value: production
      # Use your existing Neon database (no 90-day limit)
      # IMPORTANT: Set DATABASE_URL as environment variable in Render dashboard
      # NEVER commit actual credentials to git
      - key: DATABASE_URL
        value: YOUR_NEON_DATABASE_URL_HERE
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://your-app.vercel.app
      - key: AI_PROVIDER
        value: mock
      - key: CODE_EXECUTION_PROVIDER
        value: piston
      - key: PISTON_URL
        value: https://emkc.org/api/v2/piston
      - key: EXECUTION_TIMEOUT_SECONDS
        value: 10