# SprintForge.AI - Render Deployment Configuration
# No credit card required for free tier

services:
  # Backend API Service
  - type: web
    name: sprintforge-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free  # Free tier: 750 hours/month
    region: oregon  # Choose region closest to you
    
    # Environment Variables
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sprintforge-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://your-app.vercel.app
      - key: AI_PROVIDER
        value: mock
      - key: CODE_EXECUTION_PROVIDER
        value: piston
      - key: PISTON_URL
        value: https://emkc.org/api/v2/piston
      - key: EXECUTION_TIMEOUT_SECONDS
        value: 10

databases:
  # PostgreSQL Database (Free tier: 90 days)
  - name: sprintforge-db
    databaseName: sprintforge
    user: sprintforge
    plan: free  # Free PostgreSQL for 90 days
    region: oregon